[package]
org = "ballerina"
name = "freemarker"
version = "@toml.version@"
authors = ["WSO2"]
keywords = ["freemarker", "template", "rendering"]
repository = "https://github.com/ballerina-platform/module-ballerina-freemarker"
license = ["Apache-2.0"]
export = ["freemarker"]

[build-options]
observabilityIncluded = true
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "freemarker-native"
version = "@toml.version@"
path = "../native/build/libs/freemarker-native-@project.version@.jar"

[[platform.java21.dependency]]
groupId = "org.freemarker"
artifactId = "freemarker"
version = "@freemarker.version@"
path = "./lib/freemarker-@freemarker.version@.jar"
