[package]
org = "ballerinax"
name = "freemarker"
version = "1.0.0"
authors = ["WSO2"]
keywords = ["freemarker", "template", "rendering"]
repository = "https://github.com/ballerina-platform/module-ballerinax-freemarker"
license = ["Apache-2.0"]

[build-options]
observabilityIncluded = true
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "freemarker-native"
version = "1.0.0"
path = "../native/build/libs/freemarker-native-1.0.0-SNAPSHOT.jar"

[[platform.java21.dependency]]
groupId = "org.freemarker"
artifactId = "freemarker"
version = "2.3.33"
path = "./lib/freemarker-2.3.33.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-databind"
version = "2.17.0"
path = "./lib/jackson-databind-2.17.0.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-core"
version = "2.17.0"
path = "./lib/jackson-core-2.17.0.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-annotations"
version = "2.17.0"
path = "./lib/jackson-annotations-2.17.0.jar"
