[package]
org = "ballerinax"
name = "freemarker"
version = "1.0.2"
authors = ["WSO2"]
icon = "icon.png"
keywords = ["freemarker", "template", "rendering", "Area/Developer Tools", "Vendor/Apache", "Type/Library"]
repository = "https://github.com/ballerina-platform/module-ballerinax-freemarker"
license = ["Apache-2.0"]

[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "freemarker-native"
version = "1.0.2"
path = "../native/build/libs/freemarker-native-1.0.2.jar"

[[platform.java21.dependency]]
groupId = "org.freemarker"
artifactId = "freemarker"
version = "2.3.33"
path = "./lib/freemarker-2.3.33.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-databind"
version = "2.18.9"
path = "./lib/jackson-databind-2.18.9.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-core"
version = "2.18.9"
path = "./lib/jackson-core-2.18.9.jar"

[[platform.java21.dependency]]
groupId = "com.fasterxml.jackson.core"
artifactId = "jackson-annotations"
version = "2.18.9"
path = "./lib/jackson-annotations-2.18.9.jar"
